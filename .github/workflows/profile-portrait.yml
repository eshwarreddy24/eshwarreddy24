name: Refresh animated profile portrait

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_terminal_portrait.py"
      - "profile-source/portrait-smile.b64.*"
      - ".github/workflows/profile-portrait.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build animated profile visual
        run: python scripts/generate_terminal_portrait.py

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets/terminal-profile.svg profile-assets/portrait-smile.jpg profile-assets/portrait-source-meta.txt
          if git diff --cached --quiet; then
            echo "Profile assets are already current."
          else
            git commit -m "Refresh animated smiling profile visual"
            git push
          fi

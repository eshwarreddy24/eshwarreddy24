name: Refresh animated profile portrait

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_terminal_portrait.py"
      - ".github/workflows/profile-portrait.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate animated dot-matrix portrait
        run: python scripts/generate_terminal_portrait.py

      - name: Commit refreshed portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets/terminal-profile.svg profile-assets/portrait-source-meta.txt
          if git diff --cached --quiet; then
            echo "Portrait is already current."
          else
            git commit -m "Refresh animated GitHub avatar portrait"
            git push
          fi
